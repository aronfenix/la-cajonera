<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>La cajonera · trayendo tus cosas</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#2e7d5b;color:#fffdf6;font:700 20px/1.3 system-ui,sans-serif;text-align:center;padding:20px}</style>
</head>
<body>
<p id="msg">Trayendo tus cosas a la cajonera nueva…</p>
<script>
// La web antigua (aronfenix.github.io/la-cajonera/) manda aquí lo que cada tablet tenía guardado:
// #d=<json en base64url>&a=<ruta a la que volver>. Solo claves «cajon-…»; nunca se pisa lo que ya haya aquí.
(function () {
  var h = new URLSearchParams(location.hash.slice(1)), a = h.get('a') || '/', n = 0;
  if (!/^\/(?!\/)/.test(a)) a = '/';                       // solo rutas de esta misma web
  try {
    var b = (h.get('d') || '').replace(/-/g, '+').replace(/_/g, '/');
    var datos = b ? JSON.parse(decodeURIComponent(escape(atob(b)))) : {};
    Object.keys(datos).forEach(function (k) {
      var v = datos[k];
      if (!/^cajon-/.test(k) || typeof v !== 'string' || v.length > 20000) return;
      var nueva = k.replace(':/la-cajonera/', ':/');
      if (localStorage.getItem(nueva) === null) { localStorage.setItem(nueva, v); n++; }
    });
    localStorage.setItem('cajon-mudanza', new Date().toISOString().slice(0, 10) + ' · ' + n);
  } catch (e) {}
  history.replaceState(null, '', location.pathname);       // que los datos no se queden en el historial
  location.replace(a);
})();
</script>
</body>
</html>
