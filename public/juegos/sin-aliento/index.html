{
  "motor": "texto",
  "area": "lengua",
  "escena": "cuaderno",
  "personaje": "fosforito",
  "volver": "../../lengua/",
  "titulo": "Sin aliento",
  "subtitulo": "A la impresora del cole se le ha acabado la tinta de los puntos y las comas. Y a Fosforito le toca leer en voz alta lo que sale.",
  "portada": {
    "folio": true,
    "objetivo": "Pon los puntos y las comas que faltan y escucha cómo queda el texto leído con tus pausas.",
    "frase": "¡Lo leo todo seguido y me pongo morado!",
    "rotulo": "PUNTUACIÓN"
  },
  "historia": [
    {
      "nota": "QUEDA POCA TINTA. PARA AHORRAR, SE IMPRIMIRÁ SIN PUNTOS NI COMAS.",
      "firma": "La impresora"
    },
    {
      "quien": "fosforito",
      "pose": "asombro",
      "texto": "¡Me toca leer esto en voz alta y no tiene ni un punto! ¿Dónde respiro?"
    },
    {
      "quien": "boli",
      "pose": "seguro",
      "texto": "Donde acaba una idea, punto. Donde hay una pausa pequeña, coma. Tampoco es para tanto."
    },
    {
      "quien": "goma",
      "pose": "animo",
      "texto": "Y si te sobra alguno, para eso estoy yo."
    }
  ],
  "saludo": "Un punto es **una idea terminada**. Una coma, una pausa pequeña.",
  "observa": "Si nadie te ha puesto el punto, ¿cómo sabes dónde termina una oración?",
  "niveles": [
    {
      "modo": "puntua",
      "signos": [
        "."
      ],
      "generar": {
        "f": 1
      }
    },
    {
      "modo": "sentido",
      "generar": {
        "ids": [
          "comer",
          "pintar",
          "espera"
        ]
      }
    },
    {

        "."

      }

    {

      }

    {

      }
    },
    {
      "modo": "sentido",
      "generar": {

          "hambre",

        ]
      }
    },
    {

      ],

      }

    {

    {

    {

      }
    }
  ],
  "textos": [
    {
      "f": 1,
      "titulo": "La impresora",
      "t": "La impresora del cole se ha quedado sin tinta. Ahora los textos salen sin puntos ni comas. ^Fosforito intenta leerlos en voz alta y se pone morado.",
      "nota": "Tres ideas, tres puntos."
    },
    {
      "f": 1,
      "titulo": "El recreo",
      "t": "El recreo dura media hora. A mí siempre me parece que dura cinco minutos. El reloj del patio{sv} tiene algo contra nosotros."
    },
    {
      "f": 1,
      "titulo": "Robinson llega a la isla",
      "t": "El barco se hundió de madrugada. ^Robinson nadó hasta la playa sin mirar atrás. Cuando amaneció(,) estaba solo en la isla."
    },
    {
      "f": 1,
      "titulo": "El corazón",
      "t": "El corazón late unas cien mil veces al día. No descansa ni cuando duermes. Es el músculo más trabajador del cuerpo."
    },
    {
      "f": 1,
      "titulo": "Las croquetas",
      "t": "Mi abuela{sv} hace croquetas los domingos. Nadie sabe la receta. Ella dice que el secreto es no tener prisa."
    },
    {
      "f": 2,
      "titulo": "Lázaro y el jarro de vino",
      "t": "^Lázaro servía a un ciego muy listo y muy tacaño. El ciego{sv} guardaba el vino en un jarro y no lo soltaba nunca. ^Lázaro hizo un agujerito en el fondo y lo tapó con cera. Cada tarde(,) se tumbaba debajo y bebía a escondidas. El jarro pesaba cada día menos y el ciego empezó a sospechar."
    },
    {
      "f": 2,
      "titulo": "Los charcos",
      "t": "Ayer llovió toda la tarde. Hoy el patio está lleno de charcos. Los de primero{sv} los cruzan saltando por encima. Los de sexto los cruzan por el medio y luego dicen que ha sido sin querer."
    },
    {
      "f": 2,
      "titulo": "Comer cabeza abajo",
      "t": "La comida no baja al estómago por su propio peso. La empujan los músculos del esófago. Por eso(,) un astronauta puede comer cabeza abajo. El viaje de la boca al estómago{sv} dura unos diez segundos."
    },
    {
      "f": 2,
      "titulo": "El río",
      "t": "Un río nace en la montaña como un hilo de agua fría. Baja deprisa,{e} salta entre las rocas{y} y arrastra piedras. En la llanura(,) se calma y dibuja curvas. Al final(,) llega al mar(,) cansado y ancho."
    },
    {
      "f": 2,
      "titulo": "La mochila",
      "t": "En la mochila llevo un estuche,{e} dos cuadernos,{e} el bocadillo{y} y una piedra muy bonita. La piedra{sv} no sirve para nada. La llevo por si acaso.",
      "nota": "En una lista, coma entre los elementos y ninguna delante de la «y» final."
    },
    {
      "f": 2,
      "titulo": "Se acabó el recreo",
      "para": ",",
      "t": "—^Marta,{v} deja ya el balón. —Un momento,{v} profe,{v} que voy ganando. —^Marta,{v} el recreo terminó hace diez minutos.",
      "nota": "El nombre de la persona a la que hablas va siempre separado por comas."
    },
    {
      "f": 2,
      "titulo": "Los tres del estuche",
      "t": "^Goma,{i} la más veterana del estuche,{i} no se asusta por nada. ^Boli,{i} que presume de serio,{i} se ríe cuando nadie mira. ^Fosforito,{c} en cambio,{c} se emociona con todo.",
      "nota": "Una aclaración va entre dos comas: si la quitas, la oración sigue en pie."
    },
    {
      "f": 2,
      "titulo": "Una o billones",
      "t": "Todos los seres vivos están hechos de células. Algunos,{i} como las bacterias,{i} tienen solo una. Otros,{i} como tú,{i} tienen billones. Cada una hace su trabajo y todas dependen de las demás."
    },
    {
      "f": 3,
      "titulo": "El equipaje de Robinson",
      "t": "^Robinson rescató del barco un hacha,{e} dos escopetas,{e} un saco de clavos{y} y un perro. Con eso(,) tenía que empezar de nuevo. Lo primero que construyó{sv} fue una cabaña. Lo segundo fue un calendario(,) porque no quería perder la cuenta de los días."
    },
    {
      "f": 3,
      "titulo": "La semana de la tiza",
      "t": "El lunes desapareció la tiza. El martes desaparecieron el borrador,{e} las chinchetas{y} y la regla larga. El miércoles(,) el profe{sv} cerró el armario con llave. El jueves(,) alguien dejó una nota: «Devuelvo todo si quitáis el examen». El viernes hubo examen."
    },
    {
      "f": 3,
      "titulo": "Las uvas",
      "t": "Un día les regalaron un racimo de uvas. El ciego propuso comerlas de una en una(,) por turnos. Lázaro vio que su amo las cogía de dos en dos y empezó a cogerlas de tres en tres. Al terminar, el ciego dijo que lo sabía todo. Lázaro preguntó cómo. El ciego respondió que él comía de dos en dos y Lázaro callaba."
    },
    {
      "f": 3,
      "titulo": "El esqueleto",
      "t": "Tu esqueleto{sv} tiene doscientos seis huesos. El más largo es el fémur(,) en el muslo. El más pequeño está dentro del oído y mide menos que un grano de arroz. Sin ellos(,) serías un charco con ropa."
    },
    {
      "f": 1,
      "titulo": "El desayuno",
      "t": "Hoy no he desayunado. Me rugen tanto las tripas que la profe ha preguntado quién había traído un perro. He levantado la mano.",
      "nota": "Tres hechos, tres oraciones. Una coma no basta para separar dos ideas completas."
    },
    {
      "f": 1,
      "titulo": "El cartero",
      "t": "El perro que vive en la casa azul de la esquina{sv} ladra cada vez que pasa el cartero. El cartero ya no se asusta. Le deja las cartas y una galleta.",
      "nota": "Una oración puede ser larga y no llevar ni una coma: quien hace algo y lo que hace van seguidos."
    },
    {
      "f": 1,
      "titulo": "Las elecciones",
      "t": "En España hay elecciones generales cada cuatro años como máximo. Los ciudadanos mayores de edad{sv} eligen a los diputados. Después(,) los diputados eligen al presidente del Gobierno."
    },
    {
      "f": 1,
      "titulo": "La hormiga",
      "t": "Una hormiga puede cargar cincuenta veces su peso. Es como si tú levantaras un coche. Ella lo hace sin presumir."
    },
    {
      "f": 2,
      "titulo": "¿Quién ha sido?",
      "t": "Alguien se ha comido las galletas de la profe. ¿Quién ha sido? Nadie contesta. ^Fosforito tiene migas en la tapa. ¡Qué casualidad!",
      "nota": "Los signos ? y ! ya cierran la oración: detrás no se pone punto."
    },
    {
      "f": 2,
      "titulo": "Mi hermana",
      "t": "Mi hermana tiene tres años. No sabe leer,{p} pero se inventa los cuentos mirando los dibujos. Sus cuentos{sv} son mejores que los del libro."
    },
    {
      "f": 2,
      "titulo": "El autobús",
      "t": "Quería llegar pronto,{p} pero el autobús tenía otros planes. Paró en todas las paradas,{e} en dos semáforos{y} y en un sitio donde no había nada. Llegué tarde,{p} pero con buena excusa.",
      "nota": "Delante de «pero» va coma. Delante de la «y» que cierra una lista, no."
    },
    {
      "f": 2,
      "titulo": "Dos ciudades",
      "t": "^Madrid,{i} la capital de España,{i} está casi en el centro de la Península. ^Barcelona,{i} la segunda ciudad más grande,{i} está junto al mar. Las dos tienen metro,{e} atascos{y} y equipos de fútbol que no se llevan bien."
    },
    {
      "f": 2,
      "titulo": "A la mesa",
      "para": ",",
      "t": "—^Abuela,{v} ¿queda tortilla? —Claro,{v} hijo,{v} pero pon antes la mesa. —Ya voy,{v} abuela. —Y tú,{v} ^Tobi,{v} baja del sofá.",
      "nota": "Al principio, en medio o al final: el nombre de la persona a la que hablas va siempre separado por comas."
    },
    {
      "f": 3,
      "titulo": "Los murciélagos",
      "t": "Los murciélagos no son ciegos. Sin embargo,{c} de noche se guían por el oído. Lanzan chillidos muy agudos y escuchan el eco. Así saben dónde hay una pared,{e} una rama{y} o una polilla. Además,{c} casi nunca chocan."
    },
    {
      "f": 3,
      "titulo": "El toro de piedra",
      "t": "El ciego le dijo a Lázaro que acercara la oreja a un toro de piedra para oír un gran ruido. Lázaro,{i} inocente,{i} la acercó. Entonces(,) el ciego le dio tal cabezazo contra el toro que el dolor le duró tres días. Aquel día(,) Lázaro aprendió a no fiarse de nadie."
    },
    {
      "f": 3,
      "titulo": "Viernes",
      "t": "^Robinson llevaba muchos años sin hablar con nadie. Un día(,) salvó a un hombre que huía por la playa. Le enseñó a decir «sí»,{e} «no»{y} y «gracias». Como lo encontró un viernes, lo llamó Viernes."
    },
    {
      "f": 3,
      "titulo": "El plato",
      "t": "La mitad del plato{sv} son verduras y frutas. Un cuarto son cereales integrales. El otro cuarto son proteínas, como el pescado o las legumbres. Para beber(,) agua."
    },
    {
      "f": 3,
      "titulo": "Comunidades",
      "t": "^España tiene diecisiete comunidades autónomas. Algunas,{i} como Madrid o Murcia,{i} tienen una sola provincia. Otras,{i} como Andalucía,{i} tienen ocho. Además,{c} hay dos ciudades autónomas: Ceuta y Melilla."
    },
    {
      "f": 4,
      "titulo": "La excursión",
      "t": "Salimos del cole a las nueve. En el autobús cantamos,{e} comimos pipas{y} y perdimos una mochila.¶ El museo era enorme. Había un esqueleto de ballena colgado del techo. Nadie quiso ponerse debajo.",
      "nota": "Primero, el viaje. Después, el museo. Cambia el lugar: punto y aparte."
    },
    {
      "f": 4,
      "titulo": "El loro",
      "t": "Robinson le enseñó a hablar a un loro. Tardó meses en conseguir que dijera su nombre.¶ Años después(,) el loro seguía repitiéndolo por toda la isla. Era la única voz que Robinson oía,{p} pero era la suya.",
      "nota": "Entre un párrafo y otro pasan años: punto y aparte."
    },
    {
      "f": 4,
      "titulo": "El volcán",
      "t": "Los volcanes no avisan con mucha antelación. Primero tiembla el suelo. Después sale humo por el cráter.¶ En Canarias lo saben bien. En 2021(,) un volcán de La Palma estuvo casi tres meses echando lava. Cuando se apagó(,) la isla era un poco más grande.",
      "nota": "Primer párrafo: los volcanes en general. Segundo: uno en concreto. Por eso, punto y aparte."
    },
    {
      "f": 4,
      "titulo": "Colecciones",
      "t": "Mi hermano pequeño{sv} colecciona palos. Tiene palos largos,{e} palos cortos{y} y un palo que(,) según él(,) es una espada. Los guarda debajo de la cama.¶ Mi madre colecciona paciencia. La guarda donde puede.",
      "nota": "Se deja de hablar del hermano y se empieza a hablar de la madre: punto y aparte."
    },
    {
      "f": 4,
      "titulo": "La huella",
      "t": "Una mañana(,) Robinson encontró una huella en la arena. No era suya. La miró durante mucho rato(,) sin atreverse a tocarla.¶ Aquella noche no durmió. Llevaba quince años creyendo que estaba solo en la isla.",
      "nota": "Del día a la noche, de lo que ve a lo que piensa: punto y aparte."
    }
  ]
