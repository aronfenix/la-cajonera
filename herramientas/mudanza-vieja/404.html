<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>La cajonera se ha mudado</title>
<link rel="canonical" href="https://lacajonera.es/">
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#2e7d5b;color:#fffdf6;font:700 20px/1.3 system-ui,sans-serif;text-align:center;padding:20px}a{color:#ffc531}</style>
</head>
<body>
<p>La cajonera se ha mudado a <a id="ir" href="https://lacajonera.es/">lacajonera.es</a>.</p>
<script>
// Repositorio aronfenix/la-cajonera después del traslado: la misma página como index.html y 404.html.
// Recoge lo que esta tablet guardó en la web antigua y se lo lleva a la nueva, a la misma página.
(function () {
  var DESTINO = 'https://lacajonera.es';
  var ruta = location.pathname.replace(/^\/(la-cajonera|cajon-maestro)(?=\/|$)/, '') || '/';
  var datos = {}, n = 0;
  try {
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      if (/^cajon-/.test(k) && (k.indexOf(':/la-cajonera/') > 0 || k === 'cajon-sonido')) { datos[k] = localStorage.getItem(k); n++; }
    }
  } catch (e) {}
  var url = DESTINO + ruta + location.search;
  if (n) {
    var b = btoa(unescape(encodeURIComponent(JSON.stringify(datos)))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    url = DESTINO + '/mudanza/#d=' + b + '&a=' + encodeURIComponent(ruta + location.search);
  }
  document.getElementById('ir').href = DESTINO + ruta;
  location.replace(url);
})();
</script>
</body>
</html>
